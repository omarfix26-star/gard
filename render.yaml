services:
  - type: web
    name: inventory-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: COMPANY
        value: main
      - key: ADMIN_USER
        value: admin
      - key: PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: 20.11.1
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
